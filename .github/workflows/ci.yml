name: Build, Test, and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize deploys per branch but DO NOT cancel an in-progress deploy
# when a new commit arrives. lftp's mirror is incremental, so the new
# deploy can run after the current one finishes. Cancelling mid-upload
# (as we learned the hard way) leaves the server in a half-uploaded
# state.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1) Lint — PHP syntax check on every PHP file in the repo
  # ---------------------------------------------------------------------------
  lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none

      - name: Find all PHP files
        id: php-files
        run: |
          echo "files=$(find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -not -path './earnap-client/node_modules/*' | tr '\n' ' ')" >> $GITHUB_OUTPUT

      - name: Run php -l on every file
        run: |
          set -e
          ERRORS=0
          for f in ${{ steps.php-files.outputs.files }}; do
            OUT=$(php -l "$f" 2>&1) || true
            if ! echo "$OUT" | grep -q "No syntax errors"; then
              echo "::error file=$f::$OUT"
              ERRORS=$((ERRORS+1))
            fi
          done
          echo "Total errors: $ERRORS"
          if [ "$ERRORS" -gt 0 ]; then
            echo "❌ Lint failed with $ERRORS error(s)."
            exit 1
          fi
          echo "✅ All PHP files passed lint."

  # ---------------------------------------------------------------------------
  # 2) JS syntax check (no test framework — just parse the bundle entrypoint)
  # ---------------------------------------------------------------------------
  js-syntax:
    name: JS Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install esbuild (no full node_modules — just enough to parse)
        run: cd earnap-client && npm install --no-audit --no-fund esbuild@0.21.0

      - name: Parse-check every frontend JS file
        run: |
          set -e
          ERRORS=0
          for f in $(find earnap-client/src -name '*.js' -not -path '*/node_modules/*'); do
            if ! node --check "$f" 2>/dev/null; then
              echo "❌ Syntax error in $f"
              node --check "$f" || true
              ERRORS=$((ERRORS+1))
            fi
          done
          if [ "$ERRORS" -gt 0 ]; then
            exit 1
          fi
          echo "✅ All JS files passed syntax check."

  # ---------------------------------------------------------------------------
  # 3) Build the Ghost.js bundle
  # ---------------------------------------------------------------------------
  build:
    name: Build Bundle
    runs-on: ubuntu-latest
    needs: [lint, js-syntax]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd earnap-client && npm install --no-audit --no-fund

      - name: Build bundle
        run: |
          cd earnap-client
          npx esbuild src/index.js \
            --bundle \
            --minify \
            --format=esm \
            --target=es2020 \
            --outfile=../public/js/app.js

      - name: Copy CSS
        run: |
          mkdir -p public/css
          cp earnap-client/src/css/app.css public/css/app.css

      - name: Setup PHP (for composer install)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none

      - name: Composer install (production, no dev, no scripts)
        # We need vendor/ in the artifact so the server can run PHP
        # without needing shell access. --no-scripts avoids running
        # the framework's post-install hooks.
        #
        # Performance: aws/aws-sdk-php is ~60 MB and 25,000+ files,
        # making every deploy very slow. We exclude it (and its
        # flysystem adapter) because the app doesn't use S3 — the
        # default filesystem driver is 'local'. If the operator ever
        # wants S3, they can re-add it manually.
        run: |
          # Install the bulk of dependencies (incl. lockfile respect)
          composer install \
            --no-interaction \
            --no-scripts \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader

          # Strip the heavy S3 stack — not needed for the EarnApp clone.
          # Don't use --no-update (that flag would skip the actual removal).
          composer remove --no-interaction --no-scripts \
            aws/aws-sdk-php \
            league/flysystem-aws-s3-v3 \
            2>&1 | tail -5 || true

          # Regenerate the autoloader after removing packages
          composer dump-autoload --no-scripts --optimize 2>&1 | tail -3

          # Report the size so we can see the improvement
          echo "---"
          echo "vendor/ size: $(du -sh vendor | cut -f1)"
          echo "vendor/ file count: $(find vendor -type f -name '*.php' | wc -l)"

      - name: Verify outputs
        run: |
          test -f public/js/app.js || (echo "❌ public/js/app.js missing"; exit 1)
          test -f public/css/app.css || (echo "❌ public/css/app.css missing"; exit 1)
          test -d vendor || (echo "❌ vendor/ missing"; exit 1)
          test -f vendor/autoload.php || (echo "❌ vendor/autoload.php missing"; exit 1)
          JS_SIZE=$(stat -c '%s' public/js/app.js)
          CSS_SIZE=$(stat -c '%s' public/css/app.css)
          VENDOR_SIZE=$(du -sh vendor | cut -f1)
          echo "✅ public/js/app.js  = $JS_SIZE bytes"
          echo "✅ public/css/app.css = $CSS_SIZE bytes"
          echo "✅ vendor/           = $VENDOR_SIZE"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jmjob-build
          path: |
            public/
            app/
            config/
            database/
            resources/
            views/
            src/
            routes/
            vendor/
            index.php
            composer.json
            composer.lock
            migration_runner.php
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 4) Composer install + sanity test
  # ---------------------------------------------------------------------------
  test:
    name: Composer Install
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: jmjob-build
          path: .

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none

      - name: Composer install (no-scripts to avoid auto-boot)
        run: composer install --no-interaction --no-scripts --prefer-dist

      - name: Verify all critical files present
        run: |
          test -f public/index.php || (echo "❌ public/index.php missing"; exit 1)
          test -f public/js/app.js || (echo "❌ public/js/app.js missing"; exit 1)
          test -f public/css/app.css || (echo "❌ public/css/app.css missing"; exit 1)
          test -f src/Http/Request.php || (echo "❌ src/Http/Request.php missing"; exit 1)
          test -f app/Models/User.php || (echo "❌ app/Models/User.php missing"; exit 1)
          test -f routes/api.php || (echo "❌ routes/api.php missing"; exit 1)
          test -f migration_runner.php || (echo "❌ migration_runner.php missing"; exit 1)
          echo "✅ All critical files present."

      - name: Verify every controller, model, service is loadable
        run: |
          set -e
          for f in $(find app/Http/Controllers app/Models app/Services -name '*.php'); do
            OUT=$(php -l "$f" 2>&1) || true
            if ! echo "$OUT" | grep -q "No syntax errors"; then
              echo "::error file=$f::$OUT"
              exit 1
            fi
          done
          echo "✅ All app-layer PHP files are syntactically valid."

      - name: Verify every route file is loadable
        run: |
          for f in $(find routes -name '*.php'); do
            OUT=$(php -l "$f" 2>&1) || true
            if ! echo "$OUT" | grep -q "No syntax errors"; then
              echo "::error file=$f::$OUT"
              exit 1
            fi
          done
          echo "✅ All route files are syntactically valid."

  # ---------------------------------------------------------------------------
  # 5) Deploy via FTP to the live server
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy via FTP
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://jmjob.xyz

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: jmjob-build
          path: deploy

      - name: Install FTP tool (lftp — most reliable CLI FTP client)
        run: sudo apt-get update -qq && sudo apt-get install -yqq lftp

      - name: Show top-level structure
        run: ls -la deploy

      - name: Upload to FTP (full mirror — no partial state on server)
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST:     ${{ secrets.FTP_HOST }}
        run: |
          set -e
          # Show what we're about to upload
          echo "Files to upload:"
          find deploy -type f \
            -not -path 'deploy/vendor/*/tests/*' \
            -not -path 'deploy/vendor/*/Tests/*' \
            | wc -l

          # The artifact is deliberately the only local source for this job;
          # the checkout is not present, so untracked/source-only files cannot
          # be uploaded accidentally.
          #
          # The account home is /home/jmjobxyz/ and Apache serves
          # /home/jmjobxyz/public_html/. Keep the PHP application one level
          # above the document root, then flatten public/ into the document
          # root. This is the layout expected by public/index.php, which loads
          # ../vendor and ../config.
          #
          # lftp's mirror is incremental here: --ignore-time transfers only
          # files whose size differs, while deliberately leaving unrelated
          # server files untouched.
          # Note: lftp's --exclude patterns are interpreted as POSIX regex,
          # so we anchor with backslashes where needed (e.g. \.sqlite instead
          # of *.sqlite* — the trailing * in `*.sqlite*` is invalid regex).
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST" <<'EOF'
          set ssl:verify-certificate no

          # Backend/runtime files belong in the account directory, alongside
          # public_html/ (not inside the web root).
          cd public_html
          cd ..
          mirror --reverse \
                 --verbose \
                 --no-perms \
                 --ignore-time \
                 --exclude-glob 'public/' \
                 --exclude-glob 'public/**' \
                 --exclude-glob 'vendor/*/tests/' \
                 --exclude-glob 'vendor/*/Tests/' \
                 --exclude-glob 'vendor/*/.git/' \
                 --exclude-glob 'vendor/*/phpunit.xml*' \
                 --exclude-glob 'vendor/*/README.md' \
                 --exclude-glob 'vendor/*/CHANGELOG.md' \
                 --exclude-glob 'vendor/*/.github/' \
                 --exclude-glob 'vendor/composer/installed.json' \
                 --exclude-glob '.env' \
                 --exclude-glob '*.sqlite' \
                 --exclude-glob '*.sqlite-shm' \
                 --exclude-glob '*.sqlite-wal' \
                 --exclude-glob '.gitignore' \
                 --exclude-glob 'CHANGELOG.md' \
                 --exclude-glob 'README.md' \
                 --exclude-glob '*.md' \
                 --exclude-glob 'draft_*' \
                 --exclude-glob 'plan_*' \
                 --exclude-glob 'phases_*' \
                 --exclude-glob 'success-phase-*' \
                 --exclude-glob 'test_*.php' \
                 --exclude-glob 'verify_*.php' \
                 --exclude-glob 'debug_*.php' \
                 --exclude-glob 'push_*.php' \
                 --exclude-glob 'audit_*.php' \
                 --exclude-glob 'cloudstorage_*.php' \
                 --exclude-glob 'routing_middleware_*.php' \
                 --exclude-glob 'run_csrf_*.php' \
                 --exclude-glob 'setup_test_db.php' \
                 --exclude-glob 'test_db_count.php' \
                 --exclude-glob 'test_runner.php' \
                 --exclude-glob 'test.php' \
                 --exclude-glob 'db_test.php' \
                 --exclude-glob 'validator_test.php' \
                 --exclude-glob 'swagger_test.php' \
                 ./deploy/ ./

          # Public entrypoint and static assets belong directly in the
          # document root, so /js/app.js and /api/* resolve at the domain root.
          cd public_html
          mirror --reverse \
                 --verbose \
                 --no-perms \
                 --ignore-time \
                 --exclude-glob 'storage/' \
                 ./deploy/public/ ./
          bye
          EOF

      - name: Trigger migration (one-time on first deploy)
        env:
          SITE_URL: https://jmjob.xyz
        run: |
          # The migration_runner.php is safe to call multiple times; it
          # only runs un-applied migrations. After the first deploy,
          # subsequent deploys are no-ops.
          # (curl commented out — first run should be done manually)
          echo "Run this manually the first time:"
          echo "  curl -X POST https://jmjob.xyz/migration_runner.php"
          # Uncomment to auto-run:
          # curl -fsS -X POST "$SITE_URL/migration_runner.php" || true
